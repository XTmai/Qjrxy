name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: qjrxy-linux-amd64
          - goos: linux
            goarch: arm64
            asset: qjrxy-linux-arm64
          - goos: windows
            goarch: amd64
            asset: qjrxy-windows-amd64.exe
          - goos: darwin
            goarch: arm64
            asset: qjrxy-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build frontend
        run: |
          npm --prefix web/frontend ci --no-fund --no-audit
          npm --prefix web/frontend run build

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags "-s -w" \
            -o "release/${{ matrix.asset }}" ./cmd/qingjin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List files
        run: ls -lh release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
