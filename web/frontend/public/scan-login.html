<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F6F9">
<title>扫码获取登录态 · Qjrxy</title>
<style>
  /* =========================================================
     Qjrxy 移动端设计系统（与桌面端同源）
     冷灰蓝画布 + 纯白卡片 + 单一品牌蓝 #0066FF；
     绿色只表示「已完成/已就绪」，红色只表示「失败」。
     ========================================================= */
  :root {
    --brand: #0066ff;
    --brand-hover: #0052cc;
    --brand-soft: #f0f7ff;
    --brand-border: #bae0ff;

    --canvas: #f4f6f9;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --subtle: #eef2f6;
    --hairline: rgba(15, 23, 42, 0.06);
    --divider: #eef1f5;

    --ink: #0f172a;
    --ink-soft: #475569;
    --muted: #64748b;
    --faint: #94a3b8;

    --ok: #10b981;
    --ok-soft: #ecfdf5;
    --ok-border: #a7f3d0;
    --ok-ink: #065f46;

    --warn-soft: #fffbeb;
    --warn-border: #fde68a;
    --warn-ink: #92400e;

    --fail: #e11d48;
    --fail-soft: #fff1f2;
    --fail-border: #fecdd3;
    --fail-ink: #9f1239;

    --shadow-card: 0 4px 20px -2px rgba(15, 23, 42, 0.04);
    --shadow-brand: 0 6px 16px -4px rgba(0, 102, 255, 0.35);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --brand: #3b82f6;
      --brand-hover: #60a5fa;
      --brand-soft: #12233d;
      --brand-border: #1e3a5f;

      --canvas: #0e1015;
      --surface: #161922;
      --surface-2: #1b1f29;
      --subtle: #1e222d;
      --hairline: rgba(255, 255, 255, 0.08);
      --divider: #232733;

      --ink: #ededf0;
      --ink-soft: #c3c9d4;
      --muted: #8e939c;
      --faint: #6b7280;

      --ok-soft: #052e24;
      --ok-border: #065f46;
      --ok-ink: #6ee7b7;

      --warn-soft: #2d1d05;
      --warn-border: #92400e;
      --warn-ink: #fcd34d;

      --fail-soft: #2d0a13;
      --fail-border: #9f1239;
      --fail-ink: #fda4af;

      --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
    }
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    min-height: 100dvh;
    padding: max(20px, env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
    background: var(--canvas);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  .screen {
    width: 100%;
    max-width: 430px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ---------- 页头 ---------- */

  .page-head {
    padding: 4px 4px 0;
  }

  .page-head h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.35;
  }

  .page-head p {
    margin: 6px 0 0;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--muted);
    text-wrap: balance;
  }

  /* ---------- 卡片 ---------- */

  .card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 20px;
    padding: 20px;
    box-shadow: var(--shadow-card);
  }

  /* 目标记录卡：主视觉焦点，浅蓝渐变 */
  .card-target {
    background: linear-gradient(135deg, var(--brand-soft) 0%, var(--surface) 70%);
    border-color: var(--brand-border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card-target .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .card-target .eyebrow {
    font-size: 12px;
    font-weight: 600;
    color: var(--brand);
    letter-spacing: 0.01em;
  }

  .pill-pending {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 8px;
    background: var(--surface);
    border: 1px solid var(--brand-border);
    font-size: 11px;
    font-weight: 500;
    color: var(--brand);
    white-space: nowrap;
  }

  .pill-pending svg {
    width: 12px;
    height: 12px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .target-school {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.3;
  }

  .target-user-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-top: 2px;
  }

  .target-user {
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }

  .target-alias {
    display: inline-flex;
    align-items: center;
    padding: 2px 10px;
    border-radius: 999px;
    background: rgba(0, 102, 255, 0.1);
    color: var(--brand);
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    font-weight: 600;
  }

  /* ---------- 状态横幅 ---------- */

  .banner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.5;
  }

  .banner svg {
    width: 18px;
    height: 18px;
    flex: 0 0 auto;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .banner-ok {
    background: var(--ok-soft);
    border: 1px solid var(--ok-border);
    color: var(--ok-ink);
  }

  .banner-warn {
    background: var(--warn-soft);
    border: 1px solid var(--warn-border);
    color: var(--warn-ink);
  }

  .banner-fail {
    background: var(--fail-soft);
    border: 1px solid var(--fail-border);
    color: var(--fail-ink);
    align-items: flex-start;
  }

  .banner-fail svg {
    margin-top: 1px;
  }

  /* ---------- 步骤时间轴 ---------- */

  .timeline {
    display: flex;
    flex-direction: column;
  }

  .step {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding-bottom: 20px;
  }

  .step:last-child {
    padding-bottom: 0;
  }

  /* 纵向连接线：接在圆点下方 */
  .step:not(:last-child)::before {
    content: "";
    position: absolute;
    left: 13px;
    top: 30px;
    bottom: 4px;
    width: 2px;
    background: var(--divider);
  }

  .step.is-done:not(:last-child)::before {
    background: rgba(16, 185, 129, 0.25);
  }

  .dot {
    position: relative;
    z-index: 1;
    flex: 0 0 28px;
    width: 28px;
    height: 28px;
    border-radius: 999px;
    display: grid;
    place-items: center;
    background: var(--subtle);
    color: var(--muted);
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 12.5px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .step.is-running .dot {
    background: var(--brand-soft);
    color: var(--brand);
    box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.12);
  }

  .step.is-done .dot {
    background: var(--ok);
    color: #fff;
    box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
  }

  .step.is-fail .dot {
    background: var(--fail);
    color: #fff;
  }

  .step-body {
    flex: 1;
    min-width: 0;
    padding-top: 3px;
  }

  .step-title {
    font-size: 14.5px;
    font-weight: 600;
    line-height: 1.35;
    color: var(--ink);
  }

  .step.is-running .step-title,
  .step.is-fail .step-title {
    color: var(--ink);
  }

  .step-note {
    margin-top: 4px;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--muted);
    word-break: break-word;
  }

  .step.is-fail .step-note {
    color: var(--fail-ink);
  }

  /* ---------- 结果卡 ---------- */

  .card-result {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .card-head .title {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
  }

  .tag-ok {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--ok-ink);
  }

  .tag-ok svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .kv {
    border-radius: 14px;
    background: var(--surface-2);
    border: 1px solid var(--divider);
    overflow: hidden;
  }

  .kv-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 16px;
    border-bottom: 1px solid var(--divider);
  }

  .kv-row:last-child {
    border-bottom: none;
  }

  .kv-row span {
    flex: 0 0 auto;
    font-size: 13px;
    color: var(--muted);
  }

  .kv-row b {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 按钮 ---------- */

  .actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .btn {
    width: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 50px;
    padding: 0 20px;
    border: none;
    border-radius: 14px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.18s ease, transform 0.14s ease, box-shadow 0.18s ease;
  }

  .btn:active {
    transform: scale(0.985);
  }

  .btn svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .btn-primary {
    background: var(--brand);
    color: #fff;
    box-shadow: var(--shadow-brand);
  }

  .btn-primary:hover {
    background: var(--brand-hover);
  }

  .btn-primary:disabled {
    background: var(--subtle);
    color: var(--faint);
    box-shadow: none;
    cursor: default;
  }

  .btn-primary.done {
    background: var(--ok);
    box-shadow: 0 6px 16px -4px rgba(16, 185, 129, 0.35);
  }

  .btn-secondary {
    height: 48px;
    background: var(--subtle);
    color: var(--ink);
    border: 1px solid var(--hairline);
  }

  .btn-secondary:hover {
    background: var(--divider);
  }

  /* ---------- 提示 ---------- */

  .note {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    border-radius: 16px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    box-shadow: 0 2px 10px rgba(15, 23, 42, 0.02);
  }

  .note-icon {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    margin-top: 1px;
    border-radius: 11px;
    background: rgba(0, 102, 255, 0.1);
    color: var(--brand);
    display: grid;
    place-items: center;
  }

  .note-icon svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .note-body {
    flex: 1;
    min-width: 0;
    font-size: 12.5px;
    line-height: 1.65;
    color: var(--muted);
  }

  .note-body b {
    color: var(--ink-soft);
    font-weight: 600;
  }

  /* ---------- 诊断折叠 ---------- */

  details {
    border-radius: 16px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    overflow: hidden;
  }

  details summary {
    padding: 13px 16px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  details summary::-webkit-details-marker {
    display: none;
  }

  details summary::after {
    content: "›";
    color: var(--faint);
    transition: transform 0.2s ease;
  }

  details[open] summary::after {
    transform: rotate(90deg);
  }

  details pre {
    margin: 0;
    padding: 12px 16px 14px;
    border-top: 1px solid var(--divider);
    background: var(--surface-2);
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    line-height: 1.55;
    color: var(--ink-soft);
    white-space: pre-wrap;
    word-break: break-all;
  }

  .hidden {
    display: none !important;
  }

  .fx {
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 360px) {
    body {
      padding-left: 12px;
      padding-right: 12px;
    }
    .card {
      padding: 16px;
      border-radius: 18px;
    }
    .page-head h1,
    .target-school {
      font-size: 19px;
    }
    .btn {
      height: 46px;
      font-size: 14px;
    }
  }
</style>
</head>
<body>
<div class="screen">
  <div class="page-head">
    <h1>扫码获取登录态</h1>
    <p>借今日校园 App 的已登录状态换出学校会话，无需输入密码</p>
  </div>

  <!-- 目标记录：主视觉焦点 -->
  <div id="targetCard" class="card card-target hidden">
    <div class="head">
      <span class="eyebrow">即将绑定到这条记录</span>
      <span class="pill-pending">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        待核验
      </span>
    </div>
    <div id="targetSchool" class="target-school">—</div>
    <div class="target-user-row">
      <span id="targetUser" class="target-user">—</span>
      <span id="targetAlias" class="target-alias hidden"></span>
    </div>
  </div>

  <!-- 状态横幅 -->
  <div id="banner" class="banner hidden"></div>

  <!-- 3 步进度时间轴 -->
  <div class="card">
    <div class="timeline">
      <div id="step1" class="step">
        <div class="dot">1</div>
        <div class="step-body">
          <div class="step-title">读取手机设备信息</div>
          <div id="step1Note" class="step-note">等待 App 注入原生接口…</div>
        </div>
      </div>
      <div id="step2" class="step">
        <div class="dot">2</div>
        <div class="step-body">
          <div class="step-title">换取今日校园账号凭证</div>
          <div id="step2Note" class="step-note">尚未开始</div>
        </div>
      </div>
      <div id="step3" class="step">
        <div class="dot">3</div>
        <div class="step-body">
          <div class="step-title">换出学校业务会话</div>
          <div id="step3Note" class="step-note">尚未开始</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 本次换到的凭证 -->
  <div id="resultCard" class="card card-result hidden">
    <div class="card-head">
      <span class="title">本次换到的凭证</span>
      <span class="tag-ok">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        加密传输
      </span>
    </div>
    <div class="kv">
      <div class="kv-row">
        <span>登录票据</span>
        <b id="ticketMask">—</b>
      </div>
      <div class="kv-row">
        <span>设备型号</span>
        <b id="deviceMask">—</b>
      </div>
    </div>
  </div>

  <div class="actions">
    <button id="confirmBtn" class="btn btn-primary hidden" disabled>
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
      <span>确认绑定</span>
    </button>
    <button id="retryBtn" class="btn btn-secondary hidden">重新尝试</button>
  </div>

  <!-- 诊断详情：手机页的报错只存在于这台设备上（原生桥请求不经过服务端），
       所以失败时必须把原始返回摊开在屏幕上，靠截图就能定位问题。 -->
  <details id="diagCard" class="hidden">
    <summary>诊断详情（截图这一块即可）</summary>
    <pre id="diagOut" class="fx"></pre>
  </details>

  <div class="note">
    <div class="note-icon">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
    </div>
    <div class="note-body">
      <b>请先确认上面的学校与学号是你本人。</b><br>
      凭证来自这台手机上当前登录的今日校园账号。若手机登录的不是本人，绑定后会用别人的身份签到。
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var params = new URLSearchParams(location.search);
  var TICKET = params.get('t') || '';

  var $ = function (id) { return document.getElementById(id); };
  var API_ORIGIN = 'https://api.campushoy.com';
  var SET_COOKIE_URL = API_ORIGIN + '/connect/oauth2/setCookieByToken';

  var state = {
    target: null,
    oauth: null,
    host: '',
    device: null,
    ticket: '',
    appUserId: '',
    busy: false
  };

  /* ---------- 图标 ---------- */
  var ICONS = {
    check: '<polyline points="20 6 9 17 4 12"></polyline>',
    circleCheck: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>',
    alert: '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>'
  };

  function svg(name) {
    return '<svg viewBox="0 0 24 24">' + (ICONS[name] || '') + '</svg>';
  }

  // ---------- 诊断上报 ----------
  // 原生桥请求不经过服务端，失败时服务端什么都看不到；把每一步的落点
  // 与响应头回传，才可能定位是「参数不被接受」还是「会话没落下来」。
  var diagLines = [];
  function diag(stage, msg) {
    var line = '[' + stage + '] ' + msg;
    diagLines.push(line);
    // 先显示在屏幕上：这是唯一不依赖服务器版本的通路。
    try {
      var card = document.getElementById('diagCard');
      var out = document.getElementById('diagOut');
      if (card && out) {
        card.classList.remove('hidden');
        out.textContent = diagLines.join("\n\n");
      }
    } catch (e) {}
    try {
      fetch('/api/login-scan/diag', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stage: stage, text: msg })
      }).catch(function () {});
    } catch (e) {}
  }
  function diagHeaders(res) {
    var h = (res && res.headers) || {};
    var keep = {};
    // set-cookie 是判断「票据有没有种下来」的关键证据，300 字符会把
    // MOD_AUTH_CAS 截断，单独放宽（服务端日志会再做脱敏）。
    var limit = { 'set-cookie': 800 };
    ['url','location','set-cookie','content-type','code','server'].forEach(function (k) {
      for (var key in h) {
        if (Object.prototype.hasOwnProperty.call(h, key) && key.toLowerCase() === k) {
          keep[k] = String(h[key]).slice(0, limit[k] || 300);
        }
      }
    });
    return JSON.stringify(keep);
  }

  // ---------- 展示工具 ----------
  function setStep(n, phase, note) {
    var el = $('step' + n);
    if (!el) return;
    el.className = 'step' + (phase ? ' is-' + phase : '');
    if (note) $('step' + n + 'Note').textContent = note;
  }

  var bannerIcons = { ok: 'circleCheck', warn: 'alert', fail: 'alert' };
  function banner(kind, text) {
    var el = $('banner');
    el.className = 'banner banner-' + kind;
    el.innerHTML = svg(bannerIcons[kind] || 'alert') + '<span>' + escapeHtml(text) + '</span>';
    el.classList.remove('hidden');
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function mask(ticket) {
    if (!ticket) return '—';
    if (ticket.length <= 24) return ticket;
    return ticket.slice(0, 16) + '…' + ticket.slice(-6);
  }

  // 从 UA 兜底解析机型（原生接口不可用时用）
  function parseUA(ua) {
    var out = {};
    var m = /cpdaily\/([\d.]+)/i.exec(ua || '');
    if (m) out.appVersion = m[1];
    if (/iPhone/i.test(ua)) { out.systemName = 'ios'; out.deviceModel = 'iPhone'; }
    else if (/iPad/i.test(ua)) { out.systemName = 'ios'; out.deviceModel = 'iPad'; }
    else if (/Android/i.test(ua)) {
      out.systemName = 'android';
      var a = /Android\s([\d.]+)/i.exec(ua);
      if (a) out.systemVersion = a[1];
      var d = /;\s*([^;)]+)\s+Build\//i.exec(ua);
      if (d) out.deviceModel = d[1].trim();
    }
    return out;
  }

  // 把各种形态的插件返回归一成扁平对象
  function flatten(root) {
    if (!root) return null;
    if (typeof root === 'string') {
      try { root = JSON.parse(root); } catch (e) { return null; }
    }
    var candidates = [root, root.data, root.deviceInfo, root.value, root.data && root.data.value];
    for (var i = 0; i < candidates.length; i++) {
      var c = candidates[i];
      if (!c || typeof c !== 'object') continue;
      var id = c.device_id || c.deviceId || c.uuid || c.id;
      if (id && String(id).length >= 8) {
        return {
          deviceId: String(id),
          uuid: c.uuid || '',
          deviceModel: c.model || c.deviceModel || '',
          systemVersion: c.version || c.systemVersion || '',
          buildId: c.buildId || c.buildID || '',
          // 插件返回的是 "iOS" / "Android" 这种首字母大写的值，
          // 直接拿去和后端约定的 "ios" 做 === 比较会落到 Android 分支，
          // 于是在 iPhone 上显示成「iPhone17,1 · Android」。这里统一小写。
          systemName: String(c.platform || c.systemName || '').toLowerCase(),
          wisDeviceId: c.wisDeviceId || c.wisDeviceID || ''
        };
      }
    }
    return null;
  }

  // ---------- 原生桥 ----------
  function exec(svc, action, args) {
    return new Promise(function (resolve, reject) {
      if (!window.cordova || !window.cordova.exec) {
        reject(new Error('不在今日校园 App 内'));
        return;
      }
      var done = false;
      var timer = setTimeout(function () {
        if (!done) { done = true; reject(new Error('原生接口无响应')); }
      }, 20000);
      try {
        window.cordova.exec(
          function (res) { if (!done) { done = true; clearTimeout(timer); resolve(res); } },
          function (err) { if (!done) { done = true; clearTimeout(timer); reject(normalizeErr(err)); } },
          svc, action, args
        );
      } catch (e) {
        if (!done) { done = true; clearTimeout(timer); reject(e); }
      }
    });
  }

  function normalizeErr(err) {
    if (!err) return new Error('未知错误');
    if (typeof err === 'string') return new Error(err);
    return new Error(err.errmsg || err.message || JSON.stringify(err));
  }

  // needAuth:false 是绕过原生 appKey 授权的关键：
  // 设成 true 会返回 40003/50004，false 时原生照样带上 App 自己的 cookie 容器。
  function nativeGet(url) {
    return exec('MAMPHTTP', 'sendGetRequest', [{
      appKey: '', needAuth: false, url: url, headers: {}, params: {}
    }]);
  }

  function bodyOf(res) {
    var b = res && (res.data !== undefined ? res.data : res);
    if (typeof b === 'string') return b;
    if (b === undefined || b === null) return '';
    return JSON.stringify(b);
  }

  function headerOf(res, name) {
    var h = (res && res.headers) || {};
    var want = String(name).toLowerCase();
    for (var k in h) {
      if (Object.prototype.hasOwnProperty.call(h, k) && k.toLowerCase() === want) return h[k] || '';
    }
    return '';
  }

  function grabModAuthCAS(setCookie) {
    var m = /MOD_AUTH_CAS=([^;]+)/.exec(setCookie || '');
    return m ? m[1] : '';
  }

  // ---------- 取设备 ----------
  function loadDevice() {
    var ua = parseUA(navigator.userAgent);
    return exec('MAMPDevice', 'getDeviceInfo', [])
      .then(function (res) {
        var d = flatten(res);
        if (!d) throw new Error('设备信息格式无法识别');
        return {
          deviceId: d.deviceId,
          deviceModel: d.deviceModel || ua.deviceModel || '',
          systemVersion: d.systemVersion || ua.systemVersion || '',
          buildId: d.buildId || '',
          systemName: d.systemName || ua.systemName || '',
          wisDeviceId: d.wisDeviceId || '',
          appVersion: ua.appVersion || '',
          userAgent: navigator.userAgent
        };
      })
      .catch(function () {
        // 老版本 App 里插件名可能是 Device
        return exec('Device', 'getDeviceInfo', []).then(function (res) {
          var d = flatten(res);
          if (!d) throw new Error('设备信息格式无法识别');
          return {
            deviceId: d.deviceId,
            deviceModel: d.deviceModel || ua.deviceModel || '',
            systemVersion: d.systemVersion || ua.systemVersion || '',
            buildId: d.buildId || '',
            systemName: d.systemName || ua.systemName || '',
            wisDeviceId: d.wisDeviceId || '',
            appVersion: ua.appVersion || '',
            userAgent: navigator.userAgent
          };
        });
      })
      .then(function (dev) {
        state.device = dev;
        setStep(1, 'done', dev.deviceModel + ' · ' + (dev.systemName === 'ios' ? 'iOS' : 'Android') +
          ' ' + (dev.systemVersion || ''));
        return dev;
      });
  }

  // ---------- 换 cookieToken ----------
  function fetchCookieToken() {
    return nativeGet(SET_COOKIE_URL).then(function (res) {
      var raw = bodyOf(res);
      var parsed;
      try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }
      if (!parsed || parsed.code !== 0 || !parsed.datas || !parsed.datas.cookieToken) {
        throw new Error('未取到账号凭证：' + (parsed && (parsed.errMsg || parsed.code) || raw.slice(0, 80)));
      }
      state.appUserId = parsed.datas.userId || '';
      return parsed.datas.cookieToken;
    });
  }

  // ---------- authorize：让原生容器种下学校会话 ----------
  // client_id / redirect_uri / state 全部由服务端向该校 cpdailyLogin 端点要来，
  // 是这所学校专属的 OAuth 注册参数；写死别校的值只会拿到 error/500。
  //
  // 响应里真正要的是「学校种下的业务票据」，它有两个来源：
  //  1) 授权重定向链的 set-cookie 里直接就有 MOD_AUTH_CAS（网关验证
  //     oauthCallback 下发的 ticket 时种的）——拿到即成功；
  //  2) 没直接种也不算失败：链路里落下了 CASTGC（TGC），harvestTicket
  //     用 iap/login?service= 仍能换出新的业务票据。
  // 落点 url 头只用于诊断和「学校不认这套参数」的识别，不能当成败判据：
  // 新版 App（HarmonyOS 9.9.26 起）的 MAMPHTTP 不再回传 url 头，
  // 旧逻辑据此硬抛「未返回落点地址」，导致授权明明成功、票据已在
  // set-cookie 里，第 3 步却全部失败。landed 拿不到就交给 harvest 兜底。
  function authorize(cookieToken) {
    var o = state.oauth || {};
    var url = API_ORIGIN + '/connect/oauth2/authorize?response_type=code' +
      '&client_id=' + encodeURIComponent(o.clientId) +
      '&redirect_uri=' + encodeURIComponent(o.redirectUri) +
      '&state=' + encodeURIComponent(o.state || 'scan-login') +
      '&cookie_token=' + encodeURIComponent(cookieToken);
    return nativeGet(url).then(function (res) {
      // 落点的读法因平台而异：iOS 桥在 headers 里给 url，鸿蒙/安卓端给的是
      // location（原生跟随或不跟随的最后一跳不同），还有的版本把它放在
      // 响应对象的顶层字段里。三个都试，都没有不算失败——真正的成败判据
      // 是 set-cookie 里有没有 MOD_AUTH_CAS。（合并自 PR #4 的顶层字段兜底）
      var landed = headerOf(res, 'url') || headerOf(res, 'location') ||
        String((res && (res.url || res.requestUrl || res.finalUrl)) || '');
      state.lastLanded = landed;
      // 关键：换票成功的标志就写在 authorize 响应自己的 set-cookie 里
      // （CASTGC + MOD_AUTH_CAS）。实测安卓/鸿蒙端它直接出现在这一跳，
      // 不需要再打业务接口。先查这里，查到就直接成功。
      var ticket = grabModAuthCAS(headerOf(res, 'set-cookie'));
      var body = bodyOf(res);
      diag('authorize', 'landed=' + (landed || '(空，App未回传url头)')
        + ' | directTicket=' + (ticket ? '有' : '无')
        + ' | headers=' + diagHeaders(res)
        + ' | body=' + body.slice(0, 400));
      if (/error\/500/i.test(body)) {
        throw new Error('授权被拒绝（error/500）。最常见原因：这台手机上登录的今日校园账号'
          + '不是「' + (state.target && state.target.schoolName || '目标学校') + '」的学生。'
          + '请确认手机登录的是本条记录本人的账号后再试');
      }
      if (ticket) return { landed: landed, ticket: ticket };
      if (/\/connect\/pc\/qrcode\//i.test(landed)) {
        throw new Error('该校未接受扫码授权（可能不支持扫码登录）');
      }
      // 落点为空但也没有票据：交给 harvest 继续从业务入口找。
      return { landed: landed, ticket: '' };
    });
  }

  // ---------- 换出 MOD_AUTH_CAS ----------
  // 生产端每日续期用的是 IAP 网关本身的换票入口（/iap/login?service=门户登录），
  // 它不依赖任何业务应用是否部署；业务接口则依赖该校装没装对应应用。
  // 所以按「最通用 → 最具体」的顺序逐个尝试，第一个吐出票据的即成功。
  function harvestTicket() {
    var host = state.host;
    var attempts = [
      { label: 'iap换票入口',
        url: 'https://' + host + '/iap/login?service=' +
             encodeURIComponent('https://' + host + '/portal/login') },
      { label: '查寝接口',
        url: 'https://' + host + '/wec-counselor-attendance-apps/student/attendance/getStuAttendacesInOneDay' },
      { label: '签到接口',
        url: 'https://' + host + '/wec-counselor-sign-apps/stu/sign/getStuSignInfosInOneDay' },
      { label: '收集接口',
        url: 'https://' + host + '/wec-counselor-collector-apps/stu/collector/queryCollectorProcessingList' },
      { label: '门户页',
        url: 'https://' + host + '/portal/index.html' },
    ];

    var i = 0;
    function tryOne() {
      if (i >= attempts.length) {
        var landed = state.lastLanded || '(未知)';
        var landedHost = '';
        try { landedHost = new URL(landed).host; } catch (e) {}
        var hint = landedHost && landedHost !== state.host
          ? '授权落到了 ' + landedHost + '（不是学校域 ' + state.host + '）'
          : '所有换票入口都没有下发业务票据';
        throw new Error('学校未下发登录票据：' + hint
          + '（共尝试 ' + attempts.length + ' 个入口，详见诊断）');
      }
      var a = attempts[i++];
      return nativeGet(a.url).then(function (res) {
        var setCookie = headerOf(res, 'set-cookie') || headerOf(res, 'Set-Cookie');
        var ticket = grabModAuthCAS(setCookie);
        var body = bodyOf(res);
        // Tomcat 错误页的标题在 400 字之后，专门把状态行抠出来
        var tomcat = /HTTP Status (\d+)[^<]*/.exec(body);
        diag('harvest', a.label + ' | ' + diagHeaders(res)
          + (tomcat ? ' | Tomcat状态: HTTP ' + tomcat[1] : '')
          + ' | body=' + body.slice(0, 260));
        if (ticket) return ticket;
        return tryOne();
      }).catch(function (e) {
        diag('harvest', a.label + ' | 异常: ' + ((e && e.message) || String(e)));
        return tryOne();
      });
    }
    return tryOne();
  }

  // ---------- 主流程 ----------
  function run() {
    if (state.busy) return;
    state.busy = true;
    $('confirmBtn').classList.add('hidden');
    $('retryBtn').classList.add('hidden');
    $('resultCard').classList.add('hidden');
    $('banner').classList.add('hidden');
    setStep(2, '', '尚未开始');
    setStep(3, '', '尚未开始');

    var cookieToken = '';

    // 用变量显式记录「当前走到第几步」，不要靠读 className 反推：
    // 第 3 步失败时 step3 还是 running（不是 done）、step2 已是 done（不是 running），
    // 两个判断都为假就会把错误错误地标到第 1 步——用户看到「读取设备信息失败」
    // 而实际上设备早读到了，真正失败的是换票。
    var currentStep = 1;

    setStep(1, 'running', '正在读取…');
    loadDevice()
      .then(function () {
        currentStep = 2;
        setStep(2, 'running', '正在换取…');
        return fetchCookieToken();
      })
      .then(function (ct) {
        cookieToken = ct;
        // 身份前置校验：库里已绑定过指纹且与本次不同，说明这台手机登录的
        // 不是同一个人——继续下去必然失败，直接用人话说明。
        if (state.storedAppUserId && state.appUserId && state.storedAppUserId !== state.appUserId) {
          throw new Error('这台手机登录的今日校园账号，和这条记录上次绑定的是不同的人。'
            + '请用本人手机重新扫码');
        }
        setStep(2, 'done', '已取得（账号指纹 ' + (state.appUserId ? state.appUserId.slice(0, 8) + '…' : '未知') + '）');
        currentStep = 3;
        setStep(3, 'running', '正在换票…');
        return authorize(cookieToken);
      })
      .then(function (r) {
        // authorize 响应里已经带票据（安卓/鸿蒙端常见）就不用再打业务接口；
        // 没拿到（票据也不在 set-cookie 里）则靠链路落下的 CASTGC 换新票。
        return (r && r.ticket) || harvestTicket();
      })
      .then(function (ticket) {
        state.ticket = ticket;
        setStep(3, 'done', '已换到登录票据');
        $('ticketMask').textContent = mask(ticket);
        $('deviceMask').textContent = (state.device && state.device.deviceModel || '未知') +
          ' · ' + (state.device && state.device.systemName === 'ios' ? 'iOS' : 'Android');
        $('resultCard').classList.remove('hidden');
        $('confirmBtn').classList.remove('hidden');
        $('confirmBtn').disabled = false;
        banner('ok', '已就绪，请核对上方学校与学号后点「确认绑定」');
      })
      .catch(function (e) {
        var msg = (e && e.message) || String(e);
        diag('flow', 'step=' + currentStep + ' err=' + msg
          + ' device=' + JSON.stringify(state.device || {})
          + ' oauth=' + JSON.stringify(state.oauth || {}));
        setStep(currentStep, 'fail', msg);
        banner('fail', msg);
        $('retryBtn').classList.remove('hidden');
      })
      .then(function () { state.busy = false; });
  }

  // ---------- 提交 ----------
  function submit() {
    if (!state.ticket) return;
    var btn = $('confirmBtn');
    btn.disabled = true;
    btn.innerHTML = '<span>正在提交…</span>';
    fetch('/api/login-scan/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ticket: TICKET,
        modAuthCas: state.ticket,
        appUserId: state.appUserId,
        host: state.host,
        school: state.target ? state.target.schoolName : '',
        device: state.device || {}
      })
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || j.ok !== true) {
          throw new Error((j && j.error && j.error.message) || '提交失败');
        }
        banner('ok', '已提交，可以关闭本页，回到电脑端确认');
        btn.classList.add('done');
        btn.innerHTML = svg('check') + '<span>已提交 · 可以关闭本页</span>';
        btn.classList.remove('hidden');
        btn.disabled = true;
        $('retryBtn').classList.add('hidden');
      })
      .catch(function (e) {
        banner('fail', (e && e.message) || '提交失败');
        btn.disabled = false;
        btn.innerHTML = svg('check') + '<span>确认绑定</span>';
      });
  }

  // ---------- 启动 ----------
  function boot() {
    if (!TICKET) {
      banner('fail', '链接不完整：缺少票据。请在电脑端重新生成二维码。');
      return;
    }

    fetch('/api/login-scan/info?t=' + encodeURIComponent(TICKET))
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || j.ok !== true) {
          throw new Error((j && j.error && j.error.message) || '票据无效');
        }
        var d = j.data || {};
        state.target = d;
        state.host = (d.host || '').replace(/^https?:\/\//i, '').replace(/\/.*$/, '');
        state.oauth = { clientId: d.clientId || '', redirectUri: d.redirectUri || '', state: d.state || '' };
        state.storedAppUserId = d.storedAppUserId || '';
        $('targetSchool').textContent = d.schoolName || '—';
        $('targetUser').textContent = d.username || '—';
        if (d.alias) {
          var aliasEl = $('targetAlias');
          aliasEl.textContent = d.alias;
          aliasEl.classList.remove('hidden');
        }
        $('targetCard').classList.remove('hidden');

        if (!state.host) {
          banner('fail', '这条账号还没有学校域名，且自动解析失败。请在电脑端把学校名称改成今日校园里的全称后重试');
          return;
        }
        if (!state.oauth || !state.oauth.clientId || !state.oauth.redirectUri) {
          banner('fail', '该校暂不支持扫码登录（未取到授权参数）');
          return;
        }
        injectBridge();
      })
      .catch(function (e) {
        banner('fail', (e && e.message) || '票据无效或已过期');
      });
  }

  function injectBridge() {
    var ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    var script = document.createElement('script');
    script.src = ios
      ? 'https://static.campushoy.com/innerjs/cordova_ios.js'
      : 'https://static.campushoy.com/innerjs/cordova_android.js';
    script.onload = function () { setTimeout(run, 600); };
    script.onerror = function () {
      banner('fail', '无法加载 App 原生接口，请确认是在今日校园 App 内打开本页');
    };
    document.head.appendChild(script);
  }

  $('confirmBtn').addEventListener('click', submit);
  $('retryBtn').addEventListener('click', run);

  boot();
})();
</script>
</body>
</html>
