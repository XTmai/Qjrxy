<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F6F9">
<title>获取设备 ID · Qjrxy</title>
<style>
  /* =========================================================
     Qjrxy 移动端设计系统（与桌面端同源）
     冷灰蓝画布 + 纯白卡片 + 单一品牌蓝 #0066FF；
     绿色只表示「已完成/已就绪」，不做装饰。
     间距韵律 4 / 8 / 12 / 16 / 20，圆角 卡片20 · 控件14 · 小块11。
     ========================================================= */
  :root {
    --brand: #0066ff;
    --brand-hover: #0052cc;
    --brand-soft: #f0f7ff;
    --brand-border: #bae0ff;

    --canvas: #f4f6f9;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --subtle: #eef2f6;
    --hairline: rgba(15, 23, 42, 0.06);
    --divider: #eef1f5;

    --ink: #0f172a;
    --ink-soft: #475569;
    --muted: #64748b;
    --faint: #94a3b8;

    --ok: #10b981;
    --ok-soft: #ecfdf5;
    --ok-border: #a7f3d0;
    --ok-ink: #065f46;

    --warn-soft: #fffbeb;
    --warn-border: #fde68a;
    --warn-ink: #92400e;

    --fail: #e11d48;
    --fail-soft: #fff1f2;
    --fail-border: #fecdd3;
    --fail-ink: #9f1239;

    --shadow-card: 0 4px 20px -2px rgba(15, 23, 42, 0.04);
    --shadow-brand: 0 6px 16px -4px rgba(0, 102, 255, 0.35);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --brand: #3b82f6;
      --brand-hover: #60a5fa;
      --brand-soft: #12233d;
      --brand-border: #1e3a5f;

      --canvas: #0e1015;
      --surface: #161922;
      --surface-2: #1b1f29;
      --subtle: #1e222d;
      --hairline: rgba(255, 255, 255, 0.08);
      --divider: #232733;

      --ink: #ededf0;
      --ink-soft: #c3c9d4;
      --muted: #8e939c;
      --faint: #6b7280;

      --ok-soft: #052e24;
      --ok-border: #065f46;
      --ok-ink: #6ee7b7;

      --warn-soft: #2d1d05;
      --warn-border: #92400e;
      --warn-ink: #fcd34d;

      --fail-soft: #2d0a13;
      --fail-border: #9f1239;
      --fail-ink: #fda4af;

      --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
    }
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    min-height: 100dvh;
    padding: max(20px, env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
    background: var(--canvas);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  .screen {
    width: 100%;
    max-width: 430px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ---------- 卡片 ---------- */

  .card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 20px;
    padding: 20px;
    box-shadow: var(--shadow-card);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .card.loading {
    align-items: center;
    padding: 48px 24px;
    text-align: center;
    gap: 20px;
  }

  /* ---------- Hero ---------- */

  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 12px 4px 4px;
  }

  .hero-badge {
    position: relative;
    margin-bottom: 16px;
  }

  .hero-badge::before {
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 999px;
    background: rgba(16, 185, 129, 0.15);
    filter: blur(4px);
  }

  .hero-badge > span {
    position: relative;
    width: 56px;
    height: 56px;
    border-radius: 999px;
    display: grid;
    place-items: center;
    background: var(--ok);
    color: #fff;
    box-shadow: 0 8px 20px -4px rgba(16, 185, 129, 0.45);
  }

  .hero-badge.warn > span {
    background: #f59e0b;
    box-shadow: 0 8px 20px -4px rgba(245, 158, 11, 0.4);
  }

  .hero-badge.warn::before {
    background: rgba(245, 158, 11, 0.15);
  }

  .hero-badge svg {
    width: 28px;
    height: 28px;
    stroke: currentColor;
    stroke-width: 2.75;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .hero h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.35;
  }

  .hero p {
    margin: 6px 0 0;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--muted);
    text-wrap: balance;
  }

  /* ---------- 分区标签 ---------- */

  .label-pill {
    display: inline-flex;
    align-items: center;
    align-self: flex-start;
    padding: 4px 10px;
    border-radius: 8px;
    background: var(--subtle);
    color: var(--ink-soft);
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .label-plain {
    display: inline-flex;
    align-self: flex-start;
    padding: 4px 10px;
    border-radius: 8px;
    background: var(--subtle);
    color: var(--ink-soft);
    font-size: 11px;
    font-weight: 600;
  }

  .row-between {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .hint-faint {
    font-size: 11px;
    color: var(--faint);
    font-weight: 500;
  }

  /* ---------- 等宽代码框（可点击复制） ---------- */

  .code-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    border-radius: 14px;
    background: var(--surface-2);
    border: 1px dashed #cbd5e1;
    cursor: pointer;
    transition: border-color 0.16s ease, background-color 0.16s ease;
    text-align: left;
  }

  @media (prefers-color-scheme: dark) {
    .code-box {
      border-color: #3f4655;
    }
  }

  .code-box:hover {
    border-color: rgba(0, 102, 255, 0.5);
    background: var(--brand-soft);
  }

  .code-box code {
    flex: 1;
    min-width: 0;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 14.5px;
    font-weight: 600;
    line-height: 1.5;
    letter-spacing: 0.01em;
    color: var(--ink);
    /* UUID 在连字符处分段更易读；实在放不下才允许任意断行 */
    word-break: normal;
    overflow-wrap: anywhere;
    hyphens: manual;
    user-select: all;
    -webkit-user-select: all;
    font-variant-numeric: tabular-nums;
  }

  .copy-btn {
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    border-radius: 11px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    color: var(--muted);
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    transition: color 0.16s ease, border-color 0.16s ease;
    padding: 0;
  }

  .code-box:hover .copy-btn {
    color: var(--brand);
    border-color: rgba(0, 102, 255, 0.3);
  }

  .copy-btn svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .copy-btn.done {
    color: var(--ok);
    border-color: var(--ok-border);
  }

  /* ---------- 键值列表 ---------- */

  .kv {
    border-radius: 14px;
    background: var(--surface-2);
    border: 1px solid var(--divider);
    overflow: hidden;
  }

  .kv-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--divider);
  }

  .kv-row:last-child {
    border-bottom: none;
  }

  .kv-row span {
    font-size: 13.5px;
    color: var(--muted);
    font-weight: 500;
    flex: 0 0 auto;
  }

  .kv-row b {
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
    font-variant-numeric: tabular-nums;
  }

  .section-block {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-top: 4px;
    border-top: 1px solid var(--divider);
  }

  /* ---------- 按钮 ---------- */

  .actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .btn {
    width: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 50px;
    padding: 0 20px;
    border: none;
    border-radius: 14px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.18s ease, transform 0.14s ease, box-shadow 0.18s ease;
  }

  .btn:active {
    transform: scale(0.985);
  }

  .btn svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .btn-primary {
    background: var(--brand);
    color: #fff;
    box-shadow: var(--shadow-brand);
  }

  .btn-primary:hover {
    background: var(--brand-hover);
  }

  .btn-primary.done {
    background: var(--ok);
    box-shadow: 0 6px 16px -4px rgba(16, 185, 129, 0.35);
  }

  .btn-secondary {
    height: 48px;
    background: var(--subtle);
    color: var(--ink);
    border: 1px solid var(--hairline);
    box-shadow: none;
  }

  .btn-secondary:hover {
    background: var(--divider);
  }

  .btn:disabled {
    opacity: 0.55;
    cursor: default;
  }

  /* ---------- 提示卡 ---------- */

  .note {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    border-radius: 16px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    box-shadow: 0 2px 10px rgba(15, 23, 42, 0.02);
  }

  .note-icon {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    margin-top: 1px;
    border-radius: 11px;
    background: rgba(0, 102, 255, 0.1);
    color: var(--brand);
    display: grid;
    place-items: center;
  }

  .note-icon svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .note-body {
    flex: 1;
    min-width: 0;
    font-size: 12.5px;
    line-height: 1.65;
    color: var(--muted);
  }

  .note-body b {
    color: var(--ink-soft);
    font-weight: 600;
  }

  .note.warn {
    background: var(--warn-soft);
    border-color: var(--warn-border);
  }

  .note.warn .note-icon {
    background: rgba(217, 119, 6, 0.12);
    color: #d97706;
  }

  .note.warn .note-body {
    color: var(--warn-ink);
  }

  /* ---------- 步骤 ---------- */

  .steps {
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--muted);
    text-align: left;
  }

  .steps b {
    color: var(--ink);
    font-weight: 600;
  }

  /* ---------- 加载与状态 ---------- */

  .spinner {
    width: 44px;
    height: 44px;
    border: 3px solid var(--divider);
    border-top-color: var(--brand);
    border-radius: 999px;
    animation: spin 0.75s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  .status-text {
    font-size: 13.5px;
    color: var(--muted);
    min-height: 20px;
    margin: 0;
    text-align: center;
  }

  .status-text.ok {
    color: var(--ok-ink);
    font-weight: 600;
  }

  .status-text.fail {
    color: var(--fail-ink);
    font-weight: 600;
  }

  .foot {
    text-align: center;
    font-size: 11.5px;
    color: var(--faint);
    line-height: 1.7;
  }

  /* ---------- 诊断折叠 ---------- */

  details {
    border-radius: 16px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    overflow: hidden;
  }

  details summary {
    padding: 13px 16px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    list-style: none;
  }

  details summary::-webkit-details-marker {
    display: none;
  }

  details summary::after {
    content: "›";
    float: right;
    transition: transform 0.2s ease;
  }

  details[open] summary::after {
    transform: rotate(90deg);
  }

  details pre {
    margin: 0;
    padding: 12px 16px 14px;
    border-top: 1px solid var(--divider);
    background: var(--surface-2);
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    line-height: 1.55;
    color: var(--ink-soft);
    white-space: pre-wrap;
    word-break: break-all;
    font-variant-numeric: tabular-nums;
  }

  /* 极窄屏收紧一档，避免 320px 上文字贴边 */
  @media (max-width: 360px) {
    body {
      padding-left: 12px;
      padding-right: 12px;
    }
    .card {
      padding: 16px;
      border-radius: 18px;
    }
    .hero h1 {
      font-size: 20px;
    }
    .btn {
      height: 46px;
      font-size: 14px;
    }
    .code-box code {
      font-size: 13px;
    }
  }
</style>
</head>
<body>
<div class="screen">
  <div class="card loading" id="card">
    <div class="spinner"></div>
    <p class="status-text">正在获取设备信息…</p>
  </div>
</div>

<script>
/* =========================================================
 * 设备 ID 获取页
 *
 * 原理：今日校园 App 的 WebView 注入了 Cordova 运行时，
 * 页面加载官方公开的桥接脚本后调用原生插件
 * MAMPDevice.getDeviceInfo 即可拿到设备唯一标识。
 *
 * 参数 t=<ticket> 来自平台的"扫码绑定设备"弹窗，
 * 拿到 ID 后回填到对应账号（一次性票据，15 分钟有效）。
 * ========================================================= */
(function () {
  'use strict';

  var params = new URLSearchParams(location.search);
  var TICKET = params.get('t') || '';
  var SUBMIT_URL = '/api/device/submit';

  var finished = false;

  function isWeChat() { return /MicroMessenger/i.test(navigator.userAgent); }
  function isiOS() { return /\(i[^;]+;( U;)? CPU.+Mac OS X/.test(navigator.userAgent); }
  function isCpdaily() {
    return /cpdaily|wisedu|campushoy|campusphere/i.test(navigator.userAgent);
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* ---------- 图标 ---------- */
  var ICONS = {
    check: '<polyline points="20 6 9 17 4 12"></polyline>',
    alert: '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>',
    copy: '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>',
    info: '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line>'
  };

  function svg(name, cls) {
    return '<svg class="' + (cls || '') + '" viewBox="0 0 24 24">' + (ICONS[name] || '') + '</svg>';
  }

  // extraRows 渲染机型/版本等附加信息，只展示取到的项
  function extraRows(info) {
    var rows = [];
    if (info.deviceModel) rows.push(['机型', info.deviceModel]);
    if (info.systemVersion) rows.push(['系统版本', info.systemVersion]);
    if (info.buildId) rows.push(['构建号', info.buildId]);
    if (info.appVersion) rows.push(['App 版本', info.appVersion]);
    if (info.wisDeviceId) rows.push(['wisDeviceId', '已获取']);
    if (!rows.length) return '';
    var html = '<div class="section-block">' +
               '<span class="label-plain">设备信息</span><div class="kv">';
    for (var i = 0; i < rows.length; i++) {
      html += '<div class="kv-row"><span>' + escapeHtml(rows[i][0]) + '</span><b>' +
              escapeHtml(rows[i][1]) + '</b></div>';
    }
    return html + '</div></div>';
  }

  /* ---------- 成功：展示设备信息并回填平台 ---------- */
  function showSuccess(info) {
    if (finished) return;
    finished = true;

    var deviceId = info.deviceId || '';
    var uuid = info.uuid || '';
    var hasBoth = uuid && deviceId && uuid !== deviceId;

    var card = document.getElementById('card');
    card.className = 'card';
    card.innerHTML =
      '<div class="hero">' +
        '<div class="hero-badge"><span>' + svg('check') + '</span></div>' +
        '<h1>设备信息已获取</h1>' +
        '<p>' + (hasBoth
          ? '检测到两个标识，请确认绑定今日校园使用的设备 ID'
          : '复制下方标识，或直接回填到 Qjrxy 账号') + '</p>' +
      '</div>' +

      // 设备 ID 卡
      '<div class="row-between">' +
        '<span class="label-pill">Device ID · 签到使用</span>' +
        '<span class="hint-faint">唯一硬件指纹</span>' +
      '</div>' +
      '<div class="code-box" id="copyBox" role="button" tabindex="0" title="点击复制设备 ID">' +
        '<code id="idValue">' + escapeHtml(deviceId) + '</code>' +
        '<button class="copy-btn" id="inlineCopy" type="button" aria-label="复制设备 ID">' +
          svg('copy') +
        '</button>' +
      '</div>' +
      (hasBoth
        ? '<div class="section-block">' +
            '<span class="label-plain">UUID · 系统标识</span>' +
            '<div class="kv"><div class="kv-row"><span>系统标识</span><b>' + escapeHtml(uuid) + '</b></div></div>' +
            '<span class="hint-faint">签到不使用；仅供排查参考</span>' +
          '</div>'
        : '') +
      extraRows(info) +

      '<div class="actions">' +
        (TICKET
          ? '<button class="btn btn-primary" id="submitBtn">' + svg('check') +
              '<span>绑定到 Qjrxy 账号</span></button>'
          : '') +
        '<button class="btn btn-secondary" id="copyBtn">' + svg('copy') +
          '<span id="copyBtnText">复制设备 ID</span></button>' +
      '</div>' +
      '<p class="status-text" id="copyHint"></p>' +

      '<div class="note">' +
        '<div class="note-icon">' + svg('info') + '</div>' +
        '<div class="note-body"><b>绑定须知：</b>设备 ID 与设备一一对应。换手机或重装今日校园后 ID 会变化，' +
          '需要重新获取；频繁更换会被学校风控识别为「更换手机」。</div>' +
      '</div>' +
      '<div class="note">' +
        '<div class="note-icon">' + svg('info') + '</div>' +
        '<div class="note-body">授权只是绑定设备指纹，<b>不会替你登录学校账号</b>。' +
          '返回电脑端后仍需输入学号与密码完成登录。</div>' +
      '</div>' +
      '<p class="foot">' + (TICKET ? '票据 15 分钟内有效，仅可使用一次' : '没有绑定票据，仅本地展示') + '</p>';

    var hint = document.getElementById('copyHint');
    var inlineCopy = document.getElementById('inlineCopy');
    var copyBtnText = document.getElementById('copyBtnText');

    function legacyCopy(t) {
      var ta = document.createElement('textarea');
      ta.value = t;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) { /* 忽略 */ }
      document.body.removeChild(ta);
    }

    var resetTimer = null;
    function done() {
      hint.className = 'status-text ok';
      hint.textContent = '已复制到剪贴板';
      inlineCopy.classList.add('done');
      inlineCopy.innerHTML = svg('check');
      copyBtnText.textContent = '已复制';
      if (resetTimer) clearTimeout(resetTimer);
      resetTimer = setTimeout(function () {
        hint.textContent = '';
        inlineCopy.classList.remove('done');
        inlineCopy.innerHTML = svg('copy');
        copyBtnText.textContent = '复制设备 ID';
      }, 2000);
    }

    function doCopy() {
      var text = document.getElementById('idValue').innerText.trim();
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text); done(); });
      } else {
        legacyCopy(text);
        done();
      }
    }

    document.getElementById('copyBox').addEventListener('click', doCopy);
    document.getElementById('copyBtn').addEventListener('click', doCopy);

    var submitBtn = document.getElementById('submitBtn');
    if (submitBtn) {
      submitBtn.addEventListener('click', function () {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>绑定中…</span>';
        fetch(SUBMIT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ticket: TICKET,
            deviceId: info.deviceId || '',
            uuid: info.uuid || '',
            deviceModel: info.deviceModel || '',
            systemVersion: info.systemVersion || '',
            buildId: info.buildId || '',
            appVersion: info.appVersion || fromAppVersion() || '',
            wisDeviceId: info.wisDeviceId || '',
            // 原样回传 App WebView 的 UA，电脑端提交时直接使用
            userAgent: navigator.userAgent,
            systemName: info.systemName || (/iPhone|iPad|iPod/i.test(navigator.userAgent) ? 'ios' : 'android')
          })
        }).then(function (resp) {
          return resp.json().then(function (json) { return { ok: resp.ok, json: json }; });
        }).then(function (res) {
          if (res.ok && res.json && res.json.ok) {
            submitBtn.classList.add('done');
            submitBtn.innerHTML = svg('check') + '<span>已发送 · 可以关闭本页</span>';
            hint.textContent = '';
            var box = document.createElement('div');
            box.className = 'note';
            box.innerHTML = '<div class="note-icon">' + svg('info') + '</div>' +
              '<div class="note-body">设备信息已发送到电脑端，那边会自动填好，不需要手动输入。</div>';
            card.appendChild(box);
          } else {
            var msg = (res.json && res.json.error && res.json.error.message) || '绑定失败';
            submitBtn.disabled = false;
            submitBtn.innerHTML = svg('check') + '<span>重新尝试绑定</span>';
            hint.className = 'status-text fail';
            hint.textContent = msg;
          }
        }).catch(function () {
          submitBtn.disabled = false;
          submitBtn.innerHTML = svg('check') + '<span>重新尝试绑定</span>';
          hint.className = 'status-text fail';
          hint.textContent = '网络请求失败，请检查网络后重试';
        });
      });
    }
  }

  /* ---------- 失败：引导用今日校园打开 ---------- */
  function showGuide(reason) {
    var card = document.getElementById('card');
    card.className = 'card';
    var wechatTip = isWeChat()
      ? '<div class="note warn"><div class="note-icon">' + svg('alert') + '</div>' +
        '<div class="note-body">你正在微信内打开。微信会屏蔽 App 跳转，也无法读取设备 ID。' +
        '请退出微信，改用「今日校园」App 的扫一扫。</div></div>'
      : '';
    card.innerHTML =
      '<div class="hero">' +
        '<div class="hero-badge warn"><span>' + svg('alert') + '</span></div>' +
        '<h1>请在今日校园中打开</h1>' +
        '<p>设备 ID 只能在「今日校园」App 内读取——普通浏览器、微信、系统相机都没有权限</p>' +
      '</div>' +
      wechatTip +
      '<div class="section-block">' +
        '<span class="label-plain">正确操作</span>' +
        '<div class="steps">' +
          '<div>1　打开「今日校园」App</div>' +
          '<div>2　点击右上角「＋」→ <b>扫一扫</b></div>' +
          '<div>3　扫描电脑端显示的二维码</div>' +
        '</div>' +
      '</div>' +
      '<div class="actions">' +
        '<button class="btn btn-primary" id="openApp">' + svg('check') +
          '<span>尝试打开今日校园</span></button>' +
        '<button class="btn btn-secondary" id="retry">重新尝试获取</button>' +
      '</div>' +
      '<details><summary>环境调试信息</summary><pre id="dbg"></pre></details>';

    document.getElementById('dbg').textContent =
      'URL: ' + location.href + '\n' +
      'UA: ' + navigator.userAgent + '\n' +
      'cordova: ' + (window.cordova ? '存在' : '不存在') + '\n' +
      'BH_MOBILE: ' + (typeof BH_MOBILE !== 'undefined' ? '存在' : '不存在') + '\n' +
      '原因: ' + (reason || '未检测到今日校园运行环境');

    document.getElementById('retry').addEventListener('click', function () { location.reload(); });
    document.getElementById('openApp').addEventListener('click', tryOpenApp);
  }

  function tryOpenApp() {
    if (isWeChat()) return;
    if (!isiOS()) {
      location.href = 'intent://campus/#Intent;scheme=wisedu;package=com.wisedu.cpdaily;' +
        'S.browser_fallback_url=' + encodeURIComponent('https://www.wisedu.com/') + ';end';
      return;
    }
    var schemes = ['wisedu://', 'cpdaily://', 'campushoy://'];
    var i = 0;
    (function next() {
      if (i >= schemes.length) return;
      location.href = schemes[i++];
      setTimeout(next, 900);
    })();
  }

  /* ---------- 取设备信息的三条途径 ---------- */
  //
  // MAMPDevice.getDeviceInfo 会同时返回 uuid 与 deviceId：
  //   uuid     = 系统级设备标识（换系统/清刷机可能变化）
  //   deviceId = 今日校园 App 自己生成并持久化的 UUID（CpUUID），
  //              提交签到时 CpdailyInfo 里用的就是它
  // 两者含义不同，不能混用；下面同时收集，由用户确认绑定哪一个。
  // 从 App 的 WebView UA 里解析机型、Android 版本、构建号。
  // 插件不保证返回这些字段，而 UA 一定带，且与真机完全一致。
  function parseUA(ua) {
    var out = { systemVersion: '', model: '', buildId: '' };
    if (!ua) return out;
    var v = ua.match(/Android\s+([\d.]+)/i);
    if (v) out.systemVersion = v[1];
    var m = ua.match(/Android\s+[\d.]+\s*;\s*([^;)]+?)\s+Build\//i);
    if (m) out.model = m[1].replace(/^wv$/i, '').trim();
    var b = ua.match(/Build\/([^;\s)]+)/i);
    if (b) out.buildId = b[1];
    return out;
  }

  // 不同 App 版本/插件返回结构差异很大：可能是字符串、JSON 字符串、
  // 或嵌在 data / deviceInfo / value 里的对象，这里统一归一化。
  function flatten(input) {
    function obj(value, depth) {
      if (depth > 3 || value == null) return {};
      if (typeof value === 'string') {
        try { return obj(JSON.parse(value), depth + 1); } catch (e) { return { deviceId: value }; }
      }
      return typeof value === 'object' && !Array.isArray(value) ? value : {};
    }
    var root = obj(input, 0);
    var nested = [
      obj(root.data, 0), obj(root.deviceInfo, 0), obj(root.value, 0),
      obj(obj(root.data, 0).value, 0),
    ];
    var records = [root].concat(nested);
    function idOf(v) {
      return v.device_id || v.deviceId || v.uuid || v.id || '';
    }
    var rec = {};
    for (var i = 0; i < records.length; i++) {
      if (idOf(records[i])) { rec = records[i]; break; }
    }
    var id = String(idOf(rec) || '').trim();
    if (id.length < 8) return null;
    return {
      deviceId: id,
      uuid: String(rec.uuid || ''),
      model: String(rec.model || rec.deviceModel || ''),
      systemName: String(rec.systemName || rec.platform || ''),
      systemVersion: String(rec.systemVersion || rec.osVersion || ''),
      buildId: String(rec.buildId || ''),
      appVersion: String(rec.appVersion || rec.cpdailyVersion || ''),
      wisDeviceId: String(rec.wisDeviceId || rec.wis_device_id || ''),
    };
  }

  // 从 UA 里取今日校园 App 版本（cpdaily/x.x.x）
  function fromAppVersion() {
    var m = navigator.userAgent.match(/cpdaily\/([\d.]+)/i);
    return m ? m[1] : '';
  }

  function handleResult(res) {
    if (finished) return;
    var norm = flatten(res);
    if (!norm) return;
    var payload = norm;
    var uuid = norm.uuid;
    var deviceId = norm.deviceId;

    // 机型/版本优先取插件返回值，缺失时从 UA 兜底
    var fromUA = parseUA(navigator.userAgent);
    var model = payload.model || fromUA.model;
    var systemVersion = payload.systemVersion || fromUA.systemVersion;
    var buildId = payload.buildId || fromUA.buildId;
    // 插件可能返回形如 "23127PN0CC/14" 的组合值，拆开
    if (model && model.indexOf('/') > 0) {
      var parts = model.split('/');
      model = parts[0];
      if (!systemVersion) systemVersion = parts[1];
    }

    showSuccess({
      deviceId: deviceId,
      uuid: uuid,
      deviceModel: String(model || ''),
      systemVersion: String(systemVersion || ''),
      buildId: String(buildId || ''),
      appVersion: String(payload.appVersion || fromAppVersion() || ''),
      wisDeviceId: String(payload.wisDeviceId || ''),
      systemName: String(norm.systemName || ''),
      raw: payload
    });
  }

  function viaCordova() {
    if (!window.cordova || !window.cordova.exec) return;
    // 两个插件在不同 App 版本里存在：新版用 MAMPDevice，部分环境是 Device
    var plugins = [['MAMPDevice', 'getDeviceInfo'], ['Device', 'getDeviceInfo']];
    for (var i = 0; i < plugins.length; i++) {
      try {
        window.cordova.exec(
          function (res) { handleResult(res); },
          function () { /* 静默失败，走其他途径 */ },
          plugins[i][0], plugins[i][1], []
        );
      } catch (e) { /* 忽略 */ }
    }
  }

  function viaBHMobile() {
    try {
      if (typeof BH_MOBILE !== 'undefined' && BH_MOBILE.device &&
          typeof BH_MOBILE.device.getDeviceId === 'function') {
        BH_MOBILE.device.getDeviceId(function (res) { handleResult(res); });
      }
    } catch (e) { /* 忽略 */ }
  }

  function viaWindowDevice() {
    if (window.device && window.device.uuid) {
      handleResult({ deviceId: window.device.uuid, uuid: window.device.uuid });
    }
  }

  function bootstrap() {
    // 按平台加载今日校园官方公开的 Cordova 桥接脚本
    var script = document.createElement('script');
    script.src = isiOS()
      ? 'https://static.campushoy.com/innerjs/cordova_ios.js'
      : 'https://static.campushoy.com/innerjs/cordova_android.js';
    script.onerror = function () { /* 离线环境忽略 */ };
    document.head.appendChild(script);

    document.addEventListener('deviceready', pollDevice, false);

    // 持续轮询：桥接注入时机不确定，只在固定几次内尝试容易漏掉。
    // 10 秒后仍未取到再展示引导页。
    var attempts = 0;
    function pollDevice() {
      if (finished) return;
      attempts++;
      viaCordova();
      viaBHMobile();
      if (attempts >= 2) viaWindowDevice();

      if (attempts >= 7) {
        if (!finished) {
          showGuide(isCpdaily()
            ? '已检测到今日校园 UA，但原生桥未响应，可能是 App 版本不支持扫码授权'
            : '当前不在今日校园 App 内');
        }
        return;
      }
      setTimeout(pollDevice, 1500);
    }

    setTimeout(pollDevice, 300);
  }

  bootstrap();
})();
</script>
